<!DOCTYPE html>
<html lang="bg" data-accent="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ХЪСЪЛ · Семейство Бадах</title>
<meta name="description" content="Хранителните планове на Боби и Ширин, тренировъчният цикъл и общият пазар — на едно място.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ХЪСЪЛ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="icon" href="app-icon-192.png" sizes="192x192">

<link rel="preload" as="image" href="workout-monday.webp">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div id="app">
  <main id="scroll">

    <!-- ══ ДНЕС ══ -->
    <section class="view active" id="todayView"></section>

    <!-- ══ ХРАНА ══ -->
    <section class="view" id="foodView"></section>

    <!-- ══ ТРЕНИРОВКА ══ -->
    <section class="view" id="workoutView"></section>

    <!-- ══ ПАЗАР ══ -->
    <section class="view" id="shopView"></section>

    <!-- ══ РЕЦЕПТИ ══ -->
    <section class="view" id="recipesView"></section>

    <!-- ══ СТАТИСТИКА ══ -->
    <section class="view" id="statsView"></section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today" aria-label="Днес">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
      <span>Днес</span>
    </button>
    <button class="tab" data-view="food" aria-label="Храна">
      <svg viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 0 0 6 0V3"/><path d="M9 11v10"/><path d="M17.5 3c-1.6 1.4-2.5 3.6-2.5 6s.9 3.5 2.5 3.5H18V21"/></svg>
      <span>Храна</span>
    </button>
    <button class="fab" id="fab" aria-label="Бързи действия">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-view="workout" aria-label="Тренировка">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>
      <span>Фитнес</span>
    </button>
    <button class="tab" data-view="shop" aria-label="Пазар">
      <svg viewBox="0 0 24 24"><path d="M4 7h16l-1.4 12.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
      <span>Пазар</span>
    </button>
  </nav>
</div>

<div class="scrim-layer" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="sheet-scroll" id="sheetBody"></div>
</aside>

<div class="toast" id="toast"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<span id="syncStatus" hidden></span>

<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script type="module" src="firebase-sync.js"></script>
</body>
</html>
